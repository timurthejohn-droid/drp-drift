const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const f = document.getElementById('f'), pwEl = document.getElementById('pw'), err = document.getElementById('err'), btn = document.getElementById('btn');
async function open(pw, quiet) {
  btn.disabled = true; err.textContent = quiet ? '' : 'Открываю…';
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(SALT), iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    try { sessionStorage.setItem('drp_game_pw', pw); } catch (e) {}
    const html = new TextDecoder('utf-8').decode(plain);
    document.open(); document.write(html); document.close();

    try { sessionStorage.removeItem('drp_game_pw'); } catch (e) {}
    err.textContent = quiet ? '' : 'Неверный пароль';
    btn.disabled = false;
  }
}
